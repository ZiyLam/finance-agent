[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-agent"
version = "0.1.0"
description = "A finance-focused, tool-capable AI agent framework."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your team" }]
dependencies = [
  "baostock>=0.9.3,<1.0",
  "fastapi>=0.115,<1.0",
  # LangChain 1.3 introduced the APIs used by ai_agent.langchain.  Keep the
  # next major version out until its compatibility is reviewed; the allowed
  # 1.x range still receives compatible fixes and minor-version improvements.
  "langchain>=1.3,<2.0",
  "tickflow>=0.1.24,<0.2",
  "uvicorn>=0.30,<1.0",
  "yfinance>=1.5.2,<2.0",
]

[project.scripts]
finance-agent = "ai_agent.cli:main"
finance-agent-api = "ai_agent.api.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
