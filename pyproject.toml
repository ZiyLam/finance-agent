[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-agent"
version = "0.1.0"
description = "A finance-focused, tool-capable AI agent framework."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your team" }]
dependencies = ["baostock>=0.9.3,<1.0", "futu-api>=10.9.6908,<11.0", "yfinance>=1.5.2,<2.0"]

[project.scripts]
finance-agent = "ai_agent.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
